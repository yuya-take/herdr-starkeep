id = "starkeep"
name = "Starkeep"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Watch your agents work as knights on an orbital training ship"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[panes]]
id = "ship"
title = "Starkeep"
placement = "popup"
width = "90%"
height = "90%"
command = ["./target/release/starkeep"]

[[actions]]
id = "open"
title = "Open Starkeep"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin starkeep --entrypoint ship"]
