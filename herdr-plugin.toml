id = "starkeep"
name = "Starkeep"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Watch your agents work as knights on an orbital training ship"
platforms = ["linux", "macos"]

# Downloads the prebuilt binary from GitHub Releases (checksum verified),
# or builds with cargo when none matches this platform.
[[build]]
command = ["sh", "scripts/install-binary.sh"]

[[panes]]
id = "ship"
title = "Starkeep"
placement = "popup"
width = "90%"
height = "90%"
command = ["./target/release/starkeep"]

[[actions]]
id = "open"
title = "Open Starkeep"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin starkeep --entrypoint ship"]

[[actions]]
id = "setup-hooks"
title = "Starkeep: install Claude Code hooks"
contexts = ["workspace"]
command = ["sh", "hooks/install.sh"]

[[actions]]
id = "remove-hooks"
title = "Starkeep: remove Claude Code hooks"
contexts = ["workspace"]
command = ["sh", "hooks/uninstall.sh"]

[[actions]]
id = "setup-key"
title = "Starkeep: bind prefix+shift+k"
contexts = ["workspace"]
command = ["sh", "scripts/setup-key.sh"]
